<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Thermo App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #4facfe, #00f2fe);
            height: 100vh;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        .btn-custom {
            background-color: #4facfe;
            color: white;
            border-radius: 10px;
        }

        .btn-custom:hover {
            background-color: #007bff;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center" style="height:100vh;">
    
    <div class="card p-4" style="width: 400px;">
        
        <h3 class="text-center mb-4">🔥 Thermo App</h3>

        <p class="text-center text-muted">Calcul pression de bulle (T = 80°C)</p>

        <!-- Inputs -->
        <div class="mb-3">
            <input type="number" step="any" id="x1" class="form-control" placeholder="Fraction x1 (benzène)">
        </div>

        <div class="mb-3">
            <input type="number" step="any" id="x2" class="form-control" placeholder="Fraction x2 (toluène)">
        </div>

        <!-- Buttons -->
        <button class="btn btn-custom w-100 mb-2" onclick="calcul()">Calculer</button>
        <button class="btn btn-secondary w-100" onclick="reset()">Reset</button>

        <!-- Result -->
        <div id="result" class="text-center mt-4"></div>

    </div>
</div>

<script>
function calcul() {

    let x1 = parseFloat(document.getElementById('x1').value);
    let x2 = parseFloat(document.getElementById('x2').value);

    fetch('/calcul', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x1: x1, x2: x2 })
    })
    .then(res => res.json())
    .then(data => {

        if (data.error) {
            document.getElementById('result').innerHTML =
                "<span style='color:red'>" + data.error + "</span>";
        } else {
            document.getElementById('result').innerHTML =
                "📌 Pression = " + data.Pression_bulle + "<br>" +
                "🟢 y1 = " + data.y1 + "<br>" +
                "🔵 y2 = " + data.y2 + "<br>" +
                "✔️ Somme = " + data.Somme;
        }
    });
}

function reset() {
    document.getElementById('x1').value = "";
    document.getElementById('x2').value = "";
    document.getElementById('result').innerHTML = "";
}
</script>

</body>
</html>
